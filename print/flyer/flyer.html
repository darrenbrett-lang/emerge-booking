<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Emerge flyer</title>
<!-- The P1 as a printed flyer. Drawn at A4 in millimetres; ?a5 prints the
     same page scaled to A5. Render with: node print/flyer/render.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Work+Sans:ital,wght@0,600;0,700;0,800;1,700&display=block" rel="stylesheet">
<style id="page">@page{size:210mm 297mm;margin:0}</style>
<style>
:root{--night:#171713;--ivory:#F5F1E8;--acid:#EFFF00;--electric:#354BFF;--pink:#FF70BC}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--night)}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact;color:var(--ivory);font-family:'Work Sans',sans-serif}
.sheet{width:210mm;height:297mm;overflow:hidden;display:flex;flex-direction:column;background:var(--night)}
.a5 .sheet{zoom:.70711}
.panel{position:relative;isolation:isolate;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.photo{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% center}
.panel:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#17171355,transparent 30%,#17171311 44%,var(--night) 74%)}
.date{position:absolute;top:0;left:0;margin:0;padding:11mm 11mm 0;font-weight:750;font-size:8.6mm;letter-spacing:.035em;text-transform:uppercase}
.brand{position:absolute;top:30mm;left:50%;transform:translateX(-50%);width:186mm}
.brand img{display:block;width:100%;height:auto}
.brand p{margin:-1mm 6% 0 0;text-align:right;font-style:italic;font-weight:700;font-size:8.2mm;letter-spacing:-.02em;white-space:nowrap}
.copy{padding:0 11mm 12mm}
.invited{margin:0 0 6mm;font-weight:650;font-size:5.6mm;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:18.6mm;line-height:1.02;letter-spacing:-.075em;text-transform:uppercase;margin:0 0 8mm}
h1 span{display:block}
h1 span+span{color:var(--electric)}
.descriptor{font-family:'Unbounded',sans-serif;font-weight:700;font-size:8mm;line-height:1.3;letter-spacing:-.05em;text-transform:uppercase;color:var(--pink);margin:0 0 7mm;text-wrap:balance}
.meta{margin:0;font-weight:700;font-size:5.8mm;line-height:1.55;letter-spacing:.05em;text-transform:uppercase}
.meta b{color:var(--acid);margin:0 .35em}
.band{background:var(--acid);color:var(--night);padding:9mm 11mm 10mm;display:flex;align-items:flex-end;justify-content:space-between;gap:8mm}
.band p{margin:0;font-family:'Unbounded',sans-serif;text-transform:uppercase}
.cta{font-weight:800;font-size:5.4mm;letter-spacing:-.02em;margin-bottom:2.5mm!important}
.url{font-weight:800;font-size:8.6mm;letter-spacing:-.05em;text-transform:none!important;white-space:nowrap}
.price{font-weight:800;font-size:5.4mm;line-height:1.25;letter-spacing:-.03em;text-transform:none!important;text-align:right;white-space:nowrap}
</style>
<script>
if (location.search.includes("a5")) {
  document.documentElement.classList.add("a5");
  document.getElementById("page").textContent = "@page{size:148mm 210mm;margin:0}";
}
</script>
</head>
<body>
<div class="sheet">
  <div class="panel">
    <img class="photo" src="portrait.jpg" alt="">
    <img class="photo" src="star.png" alt="">
    <p class="date">27 Nov 2026 / Maidenhead</p>
    <div class="brand">
      <img src="wordmark.png" alt="Emerge">
      <p>A night that stays with you.</p>
    </div>
    <div class="copy">
      <p class="invited">You’re invited</p>
      <h1><span>Be there for</span><span>the beginning</span></h1>
      <p class="descriptor">Music, culture &amp; meaningful connection</p>
      <p class="meta">Friday 27 Nov<b>/</b>8:30 pm<br>Ben&amp;Jack Studio, Maidenhead</p>
    </div>
  </div>
  <div class="band">
    <div>
      <p class="cta">Get me in!</p>
      <p class="url">emergeunderground.com</p>
    </div>
    <p class="price">Tickets<br>from £10</p>
  </div>
</div>
</body>
</html>
